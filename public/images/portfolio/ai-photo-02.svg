<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img">
<defs>
      <linearGradient id="bg-product" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1B1130" /><stop offset="0.55" stop-color="#0B0814" /><stop offset="1" stop-color="#08080D" />
      </linearGradient>
      <radialGradient id="halo-product" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#A855F7" stop-opacity="0.65" />
        <stop offset="0.6" stop-color="#6366F1" stop-opacity="0.2" />
        <stop offset="1" stop-color="#6366F1" stop-opacity="0" />
      </radialGradient>
      <linearGradient id="bottle-product" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#E9D5FF" /><stop offset="0.3" stop-color="#A855F7" />
        <stop offset="0.62" stop-color="#4C1D95" /><stop offset="1" stop-color="#170B27" />
      </linearGradient>
      <linearGradient id="cap-product" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#2B1B42" /><stop offset="0.5" stop-color="#8B7AA8" /><stop offset="1" stop-color="#1A1026" />
      </linearGradient>
      <linearGradient id="floor-product" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#A855F7" stop-opacity="0.28" /><stop offset="1" stop-color="#08080D" stop-opacity="0" />
      </linearGradient>
      <filter id="blur-product"><feGaussianBlur stdDeviation="45" /></filter>
      <filter id="glow-product"><feGaussianBlur stdDeviation="18" /></filter>
      <filter id="grain-product" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
        <feComponentTransfer><feFuncA type="linear" slope="0.45" /></feComponentTransfer>
      </filter>
    </defs>
    <rect width="800" height="1000" fill="url(#bg-product)" />
    <circle cx="400" cy="430" r="330" fill="url(#halo-product)" filter="url(#blur-product)" />
    <g opacity="0.35">
      <circle cx="400" cy="430" r="250" stroke="#FFFFFF" stroke-opacity="0.12" fill="none" />
      <circle cx="400" cy="430" r="310" stroke="#FFFFFF" stroke-opacity="0.08" fill="none" />
      <ellipse cx="400" cy="720" rx="300" ry="70" stroke="#A855F7" stroke-opacity="0.3" fill="none" />
    </g>
    <ellipse cx="400" cy="782" rx="270" ry="60" fill="url(#floor-product)" filter="url(#blur-product)" />
    <g>
      <rect x="322" y="238" width="156" height="60" rx="16" fill="url(#cap-product)" />
      <rect x="338" y="290" width="124" height="30" rx="8" fill="#0F0A18" opacity="0.7" />
      <path d="M300 360 C300 330 330 320 356 316 L444 316 C470 320 500 330 500 360 L500 690 C500 748 456 780 400 780 C344 780 300 748 300 690 Z" fill="url(#bottle-product)" />
      <path d="M336 360 C336 345 352 338 368 336 L400 336 L400 764 C356 760 336 730 336 690 Z" fill="#FFFFFF" opacity="0.12" />
      <rect x="354" y="470" width="92" height="132" rx="4" fill="#0C0714" opacity="0.55" />
      <text x="400" y="512" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#FFFFFF" opacity="0.8" text-anchor="middle">AURA</text>
      <text x="400" y="536" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="8" letter-spacing="2" fill="#A1A1AA" text-anchor="middle">ESSENCE No. 04</text>
      <path d="M388 560 h24" stroke="#A855F7" stroke-width="1.5" opacity="0.8" />
      <ellipse cx="470" cy="400" rx="12" ry="90" fill="#FFFFFF" opacity="0.18" filter="url(#glow-product)" />
    </g>
    <g opacity="0.9">
      <circle cx="250" cy="250" r="2.4" fill="#A855F7" />
      <circle cx="640" cy="330" r="1.8" fill="#FFFFFF" opacity="0.6" />
      <circle cx="560" cy="180" r="1.5" fill="#EC4899" />
    </g>
    <rect x="26" y="26" width="748" height="948" rx="4" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" />
    <text x="52" y="86" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" letter-spacing="5" fill="#FFFFFF" opacity="0.7">NEXORA — AI STUDY</text>
    <text x="52" y="920" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" letter-spacing="4" fill="#A1A1AA">PRODUCT LIGHTING</text>
    <text x="52" y="956" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="1" fill="#FFFFFF">AURORA</text>
    <text x="748" y="956" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" letter-spacing="4" fill="#A855F7" text-anchor="end">02</text>
    <rect width="800" height="1000" filter="url(#grain-product)" opacity="0.28" style="mix-blend-mode:overlay" />
  
</svg>
