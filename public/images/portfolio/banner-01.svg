<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img">
<defs>
      <linearGradient id="bg-fest" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#160B22" /><stop offset="0.55" stop-color="#0B0713" /><stop offset="1" stop-color="#1A0C18" />
      </linearGradient>
      <radialGradient id="warm-fest" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#F59E0B" stop-opacity="0.55" /><stop offset="1" stop-color="#F59E0B" stop-opacity="0" />
      </radialGradient>
      <radialGradient id="pink-fest" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#EC4899" stop-opacity="0.45" /><stop offset="1" stop-color="#EC4899" stop-opacity="0" />
      </radialGradient>
      <linearGradient id="prod-fest" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FDE68A" /><stop offset="0.45" stop-color="#F59E0B" /><stop offset="1" stop-color="#7C2D12" />
      </linearGradient>
      <linearGradient id="type-fest" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#FFFFFF" /><stop offset="1" stop-color="#FDE68A" />
      </linearGradient>
      <filter id="blur-fest"><feGaussianBlur stdDeviation="60" /></filter>
      <filter id="grain-fest" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
        <feComponentTransfer><feFuncA type="linear" slope="0.4" /></feComponentTransfer>
      </filter>
    </defs>
    <rect width="1200" height="800" fill="url(#bg-fest)" />
    <circle cx="960" cy="200" r="360" fill="url(#warm-fest)" filter="url(#blur-fest)" />
    <circle cx="760" cy="700" r="320" fill="url(#pink-fest)" filter="url(#blur-fest)" />
    <g opacity="0.16" stroke="#FFFFFF" stroke-width="1">
      <path d="M0 650 H1200" /><path d="M0 690 H1200" /><path d="M0 730 H1200" />
      <path d="M120 800 V560" /><path d="M240 800 V560" /><path d="M360 800 V560" /><path d="M480 800 V560" />
    </g>
    <g>
      <circle cx="960" cy="360" r="190" fill="none" stroke="#F59E0B" stroke-opacity="0.35" />
      <circle cx="960" cy="360" r="235" fill="none" stroke="#F59E0B" stroke-opacity="0.15" />
      <ellipse cx="960" cy="660" rx="190" ry="34" fill="#000000" opacity="0.45" filter="url(#blur-fest)" />
      <rect x="900" y="290" width="120" height="330" rx="56" fill="url(#prod-fest)" />
      <rect x="922" y="330" width="22" height="240" rx="11" fill="#FFFFFF" opacity="0.28" />
      <rect x="924" y="230" width="72" height="70" rx="20" fill="#2A1606" opacity="0.9" />
      <rect x="944" y="248" width="32" height="34" rx="4" fill="#F59E0B" opacity="0.5" />
    </g>
    <g>
      <text x="84" y="104" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" letter-spacing="6" fill="#FFFFFF" opacity="0.8">AURA — SEASON 2026</text>
      <text x="84" y="330" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="150" font-weight="700" letter-spacing="-5" fill="url(#type-fest)">FESTIVE</text>
      <text x="84" y="474" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="150" font-weight="700" letter-spacing="-5" fill="none" stroke="#F59E0B" stroke-width="2">EDIT</text>
      <text x="90" y="540" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" letter-spacing="6" fill="#FFFFFF" opacity="0.68">NEW SEASON COLLECTION</text>
      <rect x="84" y="602" width="238" height="58" rx="29" fill="#FFFFFF" />
      <text x="203" y="638" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#120A18" text-anchor="middle">SHOP THE EDIT →</text>
      <text x="84" y="742" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#A1A1AA">CAMPAIGN CONCEPT / SOCIAL &amp; PRINT</text>
    </g>
    <rect x="24" y="24" width="1152" height="752" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" />
    <rect width="1200" height="800" filter="url(#grain-fest)" opacity="0.24" style="mix-blend-mode:overlay" />
  
</svg>
