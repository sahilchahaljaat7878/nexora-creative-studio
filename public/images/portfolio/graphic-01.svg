        <stop offset="0" stop-color="#0E0C14" /><stop offset="1" stop-color="#08080D" />
      </linearGradient>
      <linearGradient id="mono-id1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#A855F7" /><stop offset="1" stop-color="#6366F1" />
      </linearGradient>
      <radialGradient id="glow-id1" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.35" /><stop offset="1" stop-color="#8B5CF6" stop-opacity="0" />
      </radialGradient>
      <filter id="blur-id1"><feGaussianBlur stdDeviation="60" /></filter>
      <filter id="grain-id1" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
        <feComponentTransfer><feFuncA type="linear" slope="0.3" /></feComponentTransfer>
      </filter>
    </defs>
