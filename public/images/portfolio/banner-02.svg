<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img">
<defs>
      <linearGradient id="bg-launch" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0A0A1A" /><stop offset="0.5" stop-color="#111133" /><stop offset="1" stop-color="#08080D" />
      </linearGradient>
      <linearGradient id="beam-launch" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#6366F1" stop-opacity="0.8" /><stop offset="1" stop-color="#8B5CF6" stop-opacity="0.1" />
      </linearGradient>
      <radialGradient id="glow-launch" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#6366F1" stop-opacity="0.5" /><stop offset="1" stop-color="#6366F1" stop-opacity="0" />
      </radialGradient>
      <filter id="blur-launch"><feGaussianBlur stdDeviation="50" /></filter>
      <filter id="grain-launch" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
        <feComponentTransfer><feFuncA type="linear" slope="0.4" /></feComponentTransfer>
      </filter>
    </defs>
    <rect width="1200" height="800" fill="url(#bg-launch)" />
    <circle cx="900" cy="420" r="420" fill="url(#glow-launch)" filter="url(#blur-launch)" />
    <g transform="rotate(-28 900 400)">
      <rect x="640" y="-200" width="120" height="1200" fill="url(#beam-launch)" opacity="0.35" />
      <rect x="820" y="-200" width="24" height="1200" fill="#22D3EE" opacity="0.35" />
      <rect x="900" y="-200" width="3" height="1200" fill="#FFFFFF" opacity="0.4" />
    </g>
    <g opacity="0.2" stroke="#FFFFFF">
      <circle cx="930" cy="390" r="180" fill="none" /><circle cx="930" cy="390" r="260" fill="none" />
      <circle cx="930" cy="390" r="340" fill="none" />
    </g>
    <g>
      <text x="84" y="104" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" letter-spacing="6" fill="#FFFFFF" opacity="0.72">NEXORA — CAMPAIGN 01</text>
      <text x="80" y="330" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="158" font-weight="800" letter-spacing="-6" fill="#FFFFFF">LAUNCH</text>
      <text x="80" y="470" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="158" font-weight="300" letter-spacing="18" fill="#22D3EE">WEEK</text>
      <rect x="84" y="530" width="420" height="1" fill="#FFFFFF" opacity="0.24" />
      <text x="84" y="576" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" letter-spacing="4" fill="#A1A1AA">A NEW IDENTITY. A CLEARER SIGNAL.</text>
      <text x="84" y="704" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" letter-spacing="5" fill="#FFFFFF" opacity="0.55">ADVERTISING CONCEPT — DIGITAL &amp; OOH</text>
    </g>
    <g>
      <circle cx="1050" cy="620" r="66" fill="#FFFFFF" />
      <path d="M1034 594 L1074 620 L1034 646 Z" fill="#0A0A18" />
      <text x="1050" y="716" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#FFFFFF" opacity="0.6" text-anchor="middle">WATCH THE FILM</text>
    </g>
    <rect x="24" y="24" width="1152" height="752" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" />
    <rect width="1200" height="800" filter="url(#grain-launch)" opacity="0.24" style="mix-blend-mode:overlay" />
  
</svg>
