<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img">
<defs>
      <linearGradient id="paper-stat" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#E9E2D4" /><stop offset="1" stop-color="#CFC4AE" />
      </linearGradient>
      <linearGradient id="card-stat" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#221A16" /><stop offset="1" stop-color="#0E0B0A" />
      </linearGradient>
      <filter id="shadow-stat" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000" flood-opacity="0.4" />
      </filter>
      <filter id="grain-stat" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
        <feComponentTransfer><feFuncA type="linear" slope="0.3" /></feComponentTransfer>
      </filter>
    </defs>
    <rect width="1200" height="1200" fill="url(#paper-stat)" />
    <g opacity="0.35" stroke="#8C7F66">
      <path d="M0 300 H1200" /><path d="M0 600 H1200" /><path d="M0 900 H1200" />
      <path d="M300 0 V1200" /><path d="M600 0 V1200" /><path d="M900 0 V1200" />
    </g>
    <text x="72" y="100" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" letter-spacing="5" fill="#5D5241">PAPER &amp; INK — STATIONERY</text>
    <text x="1128" y="100" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#5D5241" text-anchor="end">PRINT CONCEPT</text>
    <g transform="rotate(-9 560 620)" filter="url(#shadow-stat)">
      <rect x="220" y="400" width="680" height="400" rx="10" fill="url(#card-stat)" />
      <text x="270" y="486" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="#F3EBDD">Paper &amp; Ink</text>
      <line x1="270" y1="510" x2="520" y2="510" stroke="#C8B99F" stroke-opacity="0.5" />
      <text x="270" y="540" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" letter-spacing="3" fill="#A89A83">DESIGN STUDIO — PRINT &amp; DIGITAL</text>
      <text x="270" y="716" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#F3EBDD">Sahil</text>
      <text x="270" y="738" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" letter-spacing="2" fill="#A89A83">FOUNDER</text>
      <text x="834" y="716" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#C8B99F" text-anchor="end">P&amp;I</text>
      <circle cx="834" cy="500" r="42" fill="none" stroke="#C8B99F" stroke-opacity="0.6" />
      <text x="834" y="513" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#F3EBDD" text-anchor="middle">P</text>
    </g>
    <g transform="rotate(6 760 840)" filter="url(#shadow-stat)">
      <rect x="440" y="700" width="560" height="320" rx="6" fill="#F7F1E5" />
      <text x="480" y="760" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2A241C">Paper &amp; Ink</text>
      <text x="480" y="790" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9" letter-spacing="3" fill="#7A6D5B">BRAND · DESIGN · PRINT</text>
      <line x1="480" y1="830" x2="800" y2="830" stroke="#2A241C" stroke-opacity="0.14" />
      <text x="480" y="870" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#2A241C">hello@paperandink.studio</text>
      <text x="480" y="894" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7A6D5B">paperandink.studio</text>
      <text x="480" y="918" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#7A6D5B">+91 ··········</text>
      <circle cx="930" cy="900" r="46" fill="none" stroke="#2A241C" stroke-opacity="0.25" />
      <text x="930" y="910" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2A241C" text-anchor="middle">P</text>
    </g>
    <text x="72" y="1110" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#5D5241">STATIONERY CONCEPT — BUSINESS CARDS / PAPER TONES</text>
    <rect x="32" y="32" width="1136" height="1136" fill="none" stroke="#5D5241" stroke-opacity="0.18" />
    <rect width="1200" height="1200" filter="url(#grain-stat)" opacity="0.35" style="mix-blend-mode:multiply" />
  
</svg>
