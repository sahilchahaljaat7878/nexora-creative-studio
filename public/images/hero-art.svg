<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100" role="img">
<defs>
      <radialGradient id="bg-hero" cx="50%" cy="40%" r="65%">
        <stop offset="0" stop-color="#241145" /><stop offset="0.55" stop-color="#0F0A1C" /><stop offset="1" stop-color="#08080D" />
      </radialGradient>
      <radialGradient id="orb-hero" cx="38%" cy="30%" r="72%">
        <stop offset="0" stop-color="#F5F3FF" /><stop offset="0.18" stop-color="#C4B5FD" />
        <stop offset="0.5" stop-color="#A855F7" /><stop offset="0.8" stop-color="#5B21B6" /><stop offset="1" stop-color="#1E1B4B" />
      </radialGradient>
      <radialGradient id="halo-hero" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.55" /><stop offset="1" stop-color="#8B5CF6" stop-opacity="0" />
      </radialGradient>
      <linearGradient id="ring-hero" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7" /><stop offset="0.4" stop-color="#A855F7" stop-opacity="0.5" /><stop offset="1" stop-color="#6366F1" stop-opacity="0" />
      </linearGradient>
      <linearGradient id="glass-hero" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14" /><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03" />
      </linearGradient>
      <filter id="blur-hero"><feGaussianBlur stdDeviation="40" /></filter>
      <filter id="blurSoft-hero"><feGaussianBlur stdDeviation="10" /></filter>
      <filter id="grain-hero" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
        <feComponentTransfer><feFuncA type="linear" slope="0.35" /></feComponentTransfer>
      </filter>
    </defs>
    <rect width="900" height="1100" fill="url(#bg-hero)" />
    <circle cx="450" cy="470" r="420" fill="url(#halo-hero)" filter="url(#blur-hero)" />
    <g opacity="0.5" stroke="#FFFFFF" stroke-opacity="0.08">
      <path d="M0 880 L450 760 L900 880" fill="none" />
      <path d="M0 930 L450 810 L900 930" fill="none" />
      <path d="M0 980 L450 860 L900 980" fill="none" />
      <path d="M0 1030 L450 910 L900 1030" fill="none" />
      <path d="M0 1080 L450 960 L900 1080" fill="none" />
      <path d="M180 1100 L450 760" /><path d="M320 1100 L450 760" /><path d="M580 1100 L450 760" /><path d="M720 1100 L450 760" />
    </g>
    <g>
      <circle cx="450" cy="470" r="270" fill="none" stroke="url(#ring-hero)" stroke-width="1.5" transform="rotate(-18 450 470)" />
      <ellipse cx="450" cy="470" rx="360" ry="110" fill="none" stroke="url(#ring-hero)" stroke-width="1.5" transform="rotate(-20 450 470)" />
      <ellipse cx="450" cy="470" rx="360" ry="110" fill="none" stroke="url(#ring-hero)" stroke-width="1" transform="rotate(28 450 470)" opacity="0.6" />
      <ellipse cx="450" cy="470" rx="390" ry="390" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" />
      <circle cx="450" cy="470" r="232" fill="url(#orb-hero)" />
      <circle cx="450" cy="470" r="232" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" />
      <ellipse cx="380" cy="380" rx="90" ry="56" fill="#FFFFFF" opacity="0.16" filter="url(#blurSoft-hero)" transform="rotate(-24 380 380)" />
      <circle cx="450" cy="470" r="270" fill="none" stroke="#A855F7" stroke-opacity="0.2" stroke-dasharray="1 12" />
    </g>
    <g opacity="0.8">
      <circle cx="230" cy="240" r="3" fill="#A855F7" />
      <circle cx="700" cy="330" r="2" fill="#FFFFFF" opacity="0.7" />
      <circle cx="760" cy="520" r="3.4" fill="#22D3EE" />
      <circle cx="200" cy="560" r="2" fill="#FFFFFF" opacity="0.5" />
      <circle cx="520" cy="130" r="2" fill="#EC4899" />
      <circle cx="330" cy="820" r="2.4" fill="#A855F7" />
    </g>
    <rect width="900" height="1100" filter="url(#grain-hero)" opacity="0.25" style="mix-blend-mode:overlay" />
  
</svg>
