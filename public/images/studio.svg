<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img">
<defs>
      <linearGradient id="bg-studio" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#100A1D" /><stop offset="1" stop-color="#08080D" />
      </linearGradient>
      <radialGradient id="glow-studio" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.4" /><stop offset="1" stop-color="#8B5CF6" stop-opacity="0" />
      </radialGradient>
      <linearGradient id="panelA-studio" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#2A1546" /><stop offset="1" stop-color="#0D0918" />
      </linearGradient>
      <linearGradient id="panelB-studio" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#3B1225" /><stop offset="1" stop-color="#120A12" />
      </linearGradient>
      <linearGradient id="panelC-studio" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0B2A33" /><stop offset="1" stop-color="#08101A" />
      </linearGradient>
      <filter id="blur-studio"><feGaussianBlur stdDeviation="50" /></filter>
      <filter id="shadow-studio" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000" flood-opacity="0.5" />
      </filter>
      <filter id="grain-studio" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
        <feComponentTransfer><feFuncA type="linear" slope="0.3" /></feComponentTransfer>
      </filter>
    </defs>
    <rect width="1200" height="900" fill="url(#bg-studio)" />
    <circle cx="620" cy="420" r="420" fill="url(#glow-studio)" filter="url(#blur-studio)" />
    <g opacity="0.2" stroke="#FFFFFF">
      <path d="M0 150 H1200" /><path d="M0 300 H1200" /><path d="M0 450 H1200" /><path d="M0 600 H1200" /><path d="M0 750 H1200" />
      <path d="M150 0 V900" /><path d="M300 0 V900" /><path d="M450 0 V900" /><path d="M600 0 V900" /><path d="M750 0 V900" /><path d="M900 0 V900" /><path d="M1050 0 V900" />
    </g>
    <g transform="rotate(-6 400 430)" filter="url(#shadow-studio)">
      <rect x="140" y="220" width="430" height="470" rx="22" fill="url(#panelA-studio)" stroke="#FFFFFF" stroke-opacity="0.14" />
      <circle cx="355" cy="390" r="120" fill="#A855F7" opacity="0.24" />
      <circle cx="355" cy="390" r="80" fill="none" stroke="#A855F7" stroke-opacity="0.6" />
      <rect x="180" y="590" width="160" height="12" rx="6" fill="#FFFFFF" opacity="0.55" />
      <rect x="180" y="614" width="100" height="8" rx="4" fill="#FFFFFF" opacity="0.2" />
    </g>
    <g transform="rotate(4 760 400)" filter="url(#shadow-studio)">
      <rect x="520" y="170" width="470" height="300" rx="22" fill="url(#panelB-studio)" stroke="#FFFFFF" stroke-opacity="0.14" />
      <circle cx="760" cy="320" r="100" fill="#EC4899" opacity="0.22" />
      <path d="M600 400 C680 260 840 460 920 300" stroke="#EC4899" stroke-width="1.5" fill="none" opacity="0.6" />
      <rect x="560" y="420" width="150" height="10" rx="5" fill="#FFFFFF" opacity="0.5" />
    </g>
    <g transform="rotate(-2 700 700)" filter="url(#shadow-studio)">
      <rect x="400" y="540" width="440" height="250" rx="22" fill="url(#panelC-studio)" stroke="#FFFFFF" stroke-opacity="0.14" />
      <rect x="440" y="580" width="160" height="10" rx="5" fill="#FFFFFF" opacity="0.5" />
      <rect x="440" y="604" width="90" height="7" rx="3.5" fill="#FFFFFF" opacity="0.2" />
      <circle cx="760" cy="665" r="52" fill="#22D3EE" opacity="0.18" />
      <path d="M744 645 L784 665 L744 685 Z" fill="#22D3EE" opacity="0.8" />
    </g>
    <g>
      <circle cx="960" cy="620" r="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" />
      <circle cx="960" cy="620" r="3" fill="#A855F7" />
      <circle cx="240" cy="790" r="4" fill="#22D3EE" opacity="0.8" />
      <text x="90" y="800" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" letter-spacing="5" fill="#FFFFFF" opacity="0.45">HARYANA — CREATIVE STUDIO</text>
    </g>
    <rect x="32" y="32" width="1136" height="836" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" />
    <rect width="1200" height="900" filter="url(#grain-studio)" opacity="0.2" style="mix-blend-mode:overlay" />
  
</svg>
